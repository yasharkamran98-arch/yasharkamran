    --glass-solid: rgba(20, 23, 32, 0.95);
    --glass-border: rgba(255, 255, 255, 0.13);
    --glass-shadow: 0 10px 34px 0 rgba(0, 0, 0, 0.36);
    --glass-shadow-hover: 0 16px 46px 0 rgba(0, 0, 0, 0.52);

    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.18);

    --scroll-bg-color: rgba(20, 25, 38, 0.78);

    --font-sans: 'Inter', sans-serif;
    --font-display: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background-color: #0e1118;
    color: var(--text-dark);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
}

::selection {
    background: var(--g-blue);
    color: #ffffff;
}

button {
    font-family: inherit;
    border: none;
    outline: none;
}

/* =========================================================
   02. AMBIENT BLOBS & TRANSLUCENT DUSK LAYER (SAME AS INDEX.HTML)
========================================================= */
.ambient-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -2;
    overflow: hidden;
    background: #0e1118;
    pointer-events: none;
}

.scroll-dusk-layer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
    background-color: var(--scroll-bg-color);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    will-change: background-color;
}

.blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(95px);
    opacity: 0.34;
    animation: float 15s infinite alternate ease-in-out;
}

.blob-1 { width: clamp(280px, 45vw, 500px); height: clamp(280px, 45vw, 500px); background: var(--g-blue); top: -10%; left: -5%; }
.blob-2 { width: clamp(240px, 40vw, 400px); height: clamp(240px, 40vw, 400px); background: var(--g-red); top: 20%; right: -5%; animation-delay: 2s; }
.blob-3 { width: clamp(260px, 42vw, 450px); height: clamp(260px, 42vw, 450px); background: var(--g-yellow); bottom: -10%; left: 20%; animation-delay: 4s; }
.blob-4 { width: clamp(200px, 35vw, 350px); height: clamp(200px, 35vw, 350px); background: var(--g-green); bottom: 10%; right: 15%; animation-delay: 6s; }

@keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 45px) scale(1.08); }
}

.glass {
    background: var(--glass-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
}

/* =========================================================
   03. APP LAYOUT & GLASS HEADER
========================================================= */
.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

.header {
    height: 68px;
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(12px, 2.5vw, 24px);
    background: var(--glass-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    z-index: 20;
    gap: 10px;
    width: 100%;
}

.brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
    overflow: hidden;
}

.logo-dots {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
}
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot-blue { background: var(--g-blue); }
.dot-red { background: var(--g-red); }
.dot-yellow { background: var(--g-yellow); }
.dot-green { background: var(--g-green); }

.brand-name {
    font-family: var(--font-display);
    font-size: clamp(1rem, 2.2vw, 1.25rem);
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
}

.brand-sub {
    color: var(--text-gray);
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 0.95rem;
    border-left: 2px solid var(--border-strong);
    padding-left: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 1;
}

.live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 50px;
    border: 1px solid rgba(52, 168, 83, 0.32);
    background: rgba(52, 168, 83, 0.12);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    color: #5ad47b;
    flex-shrink: 0;
}
.live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--g-green);
    box-shadow: 0 0 8px var(--g-green);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
}

.header-button {
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-dark);
    padding: 7px 14px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.header-button:hover {
    background: var(--g-blue);
    color: #ffffff;
    border-color: var(--g-blue);
}

/* =========================================================
   03B. EXPANDING SEARCH ENGINE (OPENS TOWARD LEFT)
========================================================= */
.exp-search {
    position: relative;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
}

.exp-search-trigger {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--glass-border);
    color: var(--text-dark);
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.exp-search-trigger:hover,
.exp-search-trigger:focus-visible {
    border-color: var(--g-blue);
    color: var(--g-blue-soft);
    box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.28);
}

.exp-search-trigger .material-icons-outlined {
    font-size: 19px;
}

.exp-search-field {
    position: absolute;
    top: 50%;
    right: 0;
    width: min(310px, calc(100vw - 24px));
    height: 38px;
    transform: translateY(-50%);
    z-index: 35;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px 0 13px;
    border-radius: 999px;
    background: var(--glass-solid);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(66, 133, 244, 0.55);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    clip-path: inset(0 0 0 calc(100% - 36px) round 999px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    will-change: clip-path, opacity;
    transition:
        clip-path 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.2s ease,
        visibility 0s linear 0.32s;
}

.exp-search.is-open .exp-search-field {
    clip-path: inset(0 0 0 0% round 999px);
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition:
        clip-path 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.18s ease,
        visibility 0s linear 0s;
}

.exp-search-icon {
    color: var(--g-blue);
    font-size: 18px;
    flex-shrink: 0;
    pointer-events: none;
}

.exp-search-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    outline: none;
    color: var(--text-dark);
    font-family: var(--font-sans);
    font-size: 0.84rem;
}

.exp-search-input::placeholder {
    color: var(--text-gray);
}

.exp-search-close {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-gray);
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.18s ease, color 0.18s ease;
}

.exp-search-close:hover,
.exp-search-close:focus-visible {
    background: rgba(234, 67, 53, 0.2);
    color: #ffffff;
}

.exp-search-close .material-icons-outlined {
    font-size: 16px;
}

.exp-search-results {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: min(350px, calc(100vw - 24px));
    max-height: min(400px, 62vh);
    overflow-y: auto;
    z-index: 40;
    padding: 6px;
    border-radius: 18px;
    background: var(--glass-solid);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.52);
    display: none;
    flex-direction: column;
    gap: 3px;
}

.exp-search.is-open .exp-search-results.has-query {
    display: flex;
}

.search-result-item {
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    color: var(--text-dark);
    cursor: pointer;
    background: transparent;
    transition: background-color 0.15s ease;
}

.search-result-item:hover,
.search-result-item.is-selected,
.search-result-item:focus-visible {
    background: rgba(66, 133, 244, 0.18);
    outline: none;
}

.search-result-meta {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--g-blue-soft);
}

.search-result-title {
    font-family: var(--font-display);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-dark);
}

.search-result-snippet {
    font-size: 0.78rem;
    color: var(--text-gray);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.search-result-empty {
    padding: 16px 12px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--text-gray);
}

@keyframes searchTargetPulse {
    0% {
        box-shadow: 0 0 0 0 rgba(66, 133, 244, 0.8);
    }
    65% {
        box-shadow: 0 0 0 10px rgba(66, 133, 244, 0);
    }
    100% {
        box-shadow: none;
    }
}

.search-hit-pulse {
    animation: searchTargetPulse 1.3s ease-out;
    border-radius: 12px;
}

@media (prefers-reduced-motion: reduce) {
    .exp-search-field,
    .exp-search.is-open .exp-search-field {
        transition: none !important;
    }
}

/* =========================================================
   04. 3-COLUMN STUDIO GRID & GLASS SIDEBARS
========================================================= */
.main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(220px, 260px) minmax(0, 1fr) minmax(240px, 290px);
}

.sidebar {
    min-width: 0;
    overflow: hidden;
    border-right: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}
.sidebar.right {
    border-right: 0;
    border-left: 1px solid var(--glass-border);
}
.sidebar-inner {
    height: 100%;
    overflow-y: auto;
    padding: 20px 14px;
}
.sidebar-title {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--g-blue-soft);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 12px;
    padding: 0 6px;
}

.course-item, .lesson-item {
    width: 100%;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-gray);
    text-align: left;
    padding: 10px 12px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 0.86rem;
    font-weight: 600;
    margin-bottom: 6px;
    transition: all 0.22s ease;
    min-height: 42px;
}

.course-item:hover, .lesson-item:hover {
    background: var(--glass-bg-hover);
    color: var(--text-dark);
    border-color: var(--glass-border);
    transform: translateX(3px);
}

.course-item.active, .lesson-item.active {
    background: var(--g-blue);
    border-color: var(--g-blue);
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(66, 133, 244, 0.32);
}

.item-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.course-icon {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: rgba(66, 133, 244, 0.16);
    color: var(--g-blue-soft);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.22s ease;
}

.course-item.active .course-icon {
    background: rgba(255, 255, 255, 0.22);
    color: #ffffff;
}

.sidebar-course-title {
    margin: 4px 8px 12px;
    color: var(--text-dark);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sidebar-chapter-btn {
    width: 100%;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-dark);
    text-align: left;
    padding: 10px 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 0.82rem;
    font-weight: 600;
    margin-top: 8px;
    transition: all 0.2s ease;
}

.chap-title-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sidebar-chapter-btn:hover,
.sidebar-chapter-btn.active-chap {
    background: var(--glass-bg-hover);
    border-color: var(--g-blue);
    color: var(--g-blue-soft);
}

.chapter-lessons-container {
    display: none;
    flex-direction: column;
    gap: 4px;
    padding-left: 8px;
    margin-bottom: 10px;
    border-left: 2px solid rgba(66, 133, 244, 0.35);
    margin-left: 10px;
    padding-top: 6px;
}
.chapter-lessons-container.open { display: flex; }

.empty-note-sidebar {
    padding: 8px 10px;
    font-size: 11px;
    color: var(--text-gray);
    font-family: var(--font-mono);
}

.lesson-number {
    color: var(--text-gray);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    width: 20px;
    flex-shrink: 0;
}
.lesson-item.active .lesson-number {
    color: #ffffff;
}

.lesson-vid-icon {
    font-size: 9px;
    color: #ff7b72;
    background: rgba(234, 67, 53, 0.16);
    padding: 2px 6px;
    border-radius: 50px;
    font-family: var(--font-mono);
    font-weight: 700;
    flex-shrink: 0;
}
.lesson-item.active .lesson-vid-icon {
    background: rgba(255, 255, 255, 0.25);
    color: #ffffff;
}

.quiz-sidebar-btn {
    margin-top: 4px;
    border: 1px dashed rgba(52, 168, 83, 0.5);
    background: rgba(52, 168, 83, 0.1);
    color: var(--text-dark);
}
.quiz-badge-icon {
    font-size: 12px;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
}
.quiz-count-pill {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 50px;
    background: rgba(52, 168, 83, 0.18);
    color: #5ad47b;
    flex-shrink: 0;
    white-space: nowrap;
}
.quiz-sidebar-btn.active .quiz-count-pill {
    background: rgba(255, 255, 255, 0.25);
    color: #ffffff;
}

.final-exam-sidebar-wrap {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}
.final-exam-sidebar-btn {
    width: 100%;
    padding: 11px 13px;
    border-radius: 14px;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    cursor: pointer;
    gap: 8px;
    transition: all 0.22s ease;
}
.final-exam-sidebar-btn:hover {
    background: var(--glass-bg-hover);
    transform: translateY(-1px);
}
.final-exam-sidebar-btn.active {
    border-color: var(--g-blue);
    box-shadow: 0 8px 20px rgba(66, 133, 244, 0.25);
}
.final-exam-info-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}
.final-exam-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: rgba(66, 133, 244, 0.18);
    display: grid;
    place-items: center;
    font-size: 15px;
    flex-shrink: 0;
}
.final-exam-text-wrap {
    min-width: 0;
}
.final-exam-heading {
    font-size: 11.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.final-exam-subtext {
    font-size: 9.5px;
    font-family: var(--font-mono);
    color: var(--text-gray);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.final-exam-arrow {
    flex-shrink: 0;
}

/* =========================================================
   05. CENTER CONTENT & READING FRAME + BACK TO TOP
========================================================= */
.content {
    position: relative;
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.content-scroll {
    flex: 1;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    padding: clamp(16px, 3.5vw, 36px) clamp(12px, 3vw, 48px) 84px;
}

/* Back to Top button anchored inside .content so it never overlaps sidebars */
.back-to-top {
    position: absolute;
    right: 22px;
    bottom: 22px;
    z-index: 30;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    color: var(--text-dark);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translate3d(0, 14px, 0) scale(0.9);
    will-change: transform, opacity;
    transition:
        opacity 0.28s ease,
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        visibility 0s linear 0.28s;
}

.back-to-top.is-visible {
    opacity: 0.92;
    visibility: visible;
    pointer-events: auto;
    transform: translate3d(0, 0, 0) scale(1);
    transition:
        opacity 0.28s ease,
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        visibility 0s linear 0s;
}

.back-to-top:hover,
.back-to-top:focus-visible {
    opacity: 1;
    background: var(--glass-bg-hover);
    border-color: rgba(66, 133, 244, 0.55);
    color: var(--g-blue-soft);
    transform: translate3d(0, -3px, 0) scale(1.04);
    box-shadow: 0 10px 28px rgba(66, 133, 244, 0.28);
}

.back-to-top:active {
    transform: translate3d(0, 0, 0) scale(0.95);
}

.back-to-top .material-icons-outlined {
    font-size: 21px;
    position: relative;
    z-index: 2;
}

.btt-progress {
    position: absolute;
    inset: -1px;
    width: calc(100% + 2px);
    height: calc(100% + 2px);
    transform: rotate(-90deg);
    pointer-events: none;
    z-index: 1;
}

.btt-track {
    fill: none;
    stroke: rgba(255, 255, 255, 0.08);
    stroke-width: 2;
}

.btt-bar {
    fill: none;
    stroke: var(--g-blue);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-dasharray: 128.8;
    stroke-dashoffset: 128.8;
}

@media (prefers-reduced-motion: reduce) {
    .back-to-top {
        transform: none !important;
        transition: opacity 0.15s ease !important;
    }
}

.breadcrumbs {
    max-width: 860px;
    margin: 0 auto 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    color: var(--text-gray);
    font-size: 0.74rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.breadcrumbs strong {
    color: var(--text-dark);
}

.lesson-page {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 42px);
    border-radius: clamp(18px, 3vw, 28px);
}
.lesson-tag {
    display: inline-flex;
    padding: 5px 12px;
    border-radius: 50px;
    color: var(--g-blue-soft);
    background: rgba(66, 133, 244, 0.16);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.7px;
    margin-bottom: 14px;
    text-transform: uppercase;
}
.lesson-page h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3.8vw, 2.5rem);
    line-height: 1.18;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    word-break: break-word;
}
.content-body {
    font-size: clamp(0.92rem, 1.3vw, 1rem);
    line-height: 1.8;
    color: var(--text-dark);
    word-break: break-word;
}
.content-body h2 {
    font-family: var(--font-display);
    font-size: clamp(1.25rem, 2.4vw, 1.45rem);
    margin: 28px 0 10px;
}
.content-body h3 {
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 2vw, 1.2rem);
    margin: 20px 0 8px;
}

.content-body p {
    margin: 0 0 16px;
    color: var(--text-dark);
    white-space: pre-line;
    word-break: break-word;
    overflow-wrap: break-word;
}

.content-body img, .article-block img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 20px auto;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
}

/* Video Player Card */
.video-player-card {
    margin: 22px 0;
    border-radius: 18px;
    overflow: hidden;
    width: 100%;
}
.video-player-bar {
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--text-gray);
    flex-wrap: wrap;
}
.video-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dark);
}
.video-pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--g-red);
    box-shadow: 0 0 8px var(--g-red);
    flex-shrink: 0;
}
.video-server-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.srv-btn {
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-dark);
    padding: 6px 11px;
    border-radius: 50px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s ease;
    white-space: nowrap;
}
.srv-btn:hover {
    border-color: var(--g-blue);
    color: #ffffff;
}
.srv-btn.primary-play {
    background: var(--g-blue);
    color: #ffffff;
    border-color: var(--g-blue);
}
.video-frame-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0b0d11;
}
.video-frame-container iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}
.video-poster-facade {
    position: absolute;
    inset: 0;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}
.video-poster-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    margin: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    filter: brightness(0.85);
    transition: transform 0.4s ease, filter 0.3s ease;
}
.video-poster-facade:hover .video-poster-img {
    transform: scale(1.02);
    filter: brightness(0.95);
}
.video-poster-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: radial-gradient(circle, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.58) 100%);
    padding: 14px;
    text-align: center;
}
.video-play-circle {
    width: clamp(52px, 8vw, 64px);
    height: clamp(52px, 8vw, 64px);
    border-radius: 50%;
    background: var(--g-blue);
    color: #ffffff;
    display: grid;
    place-items: center;
    box-shadow: 0 10px 28px rgba(66, 133, 244, 0.5);
    transition: transform 0.25s ease;
}
.video-poster-facade:hover .video-play-circle {
    transform: scale(1.06);
}
.video-play-caption {
    font-size: clamp(0.7rem, 1.4vw, 0.78rem);
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
    padding: 5px 12px;
    border-radius: 50px;
    background: rgba(20, 22, 30, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

/* Assessment & Interactive Cards */
.lesson-assessment-cta {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.assessment-banner-card {
    padding: 18px 20px;
    border-radius: 18px;
    border: 1px solid rgba(52, 168, 83, 0.42);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
}
.assessment-banner-card.final {
    border-color: rgba(66, 133, 244, 0.45);
}
.assessment-text-area {
    flex: 1;
    min-width: min(100%, 260px);
}
.assessment-kicker {
    font-size: 0.7rem;
    color: #5ad47b;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 4px;
}
.assessment-title {
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 700;
}
.assessment-meta {
    font-size: 0.8rem;
    color: var(--text-gray);
    margin-top: 3px;
}
.cta-btn {
    white-space: nowrap;
    align-self: center;
}

/* Quiz Presentation */
.quiz-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}
.quiz-main-heading {
    margin-top: 12px;
    font-size: clamp(1.4rem, 3.2vw, 2.1rem);
}
.quiz-telemetry-strip {
    margin: 14px 0 24px;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: rgba(66, 133, 244, 0.08);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    color: var(--text-gray);
    align-items: center;
}
.quiz-telemetry-strip strong {
    color: var(--g-blue-soft);
}
.sep-slash {
    opacity: 0.4;
}

.quiz-questions-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.quiz-question-card {
    padding: clamp(16px, 3vw, 24px);
    border-radius: 18px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.04);
}
.quiz-question-card.graded-correct {
    border-color: var(--g-green);
}
.quiz-question-card.graded-wrong {
    border-color: var(--g-red);
}
.quiz-q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    color: var(--text-gray);
    margin-bottom: 10px;
}
.quiz-q-num {
    font-weight: 700;
    color: var(--g-blue-soft);
}
.quiz-q-pts {
    padding: 3px 8px;
    border-radius: 50px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.06);
}
.quiz-q-text {
    font-family: var(--font-display);
    font-size: clamp(1rem, 2vw, 1.12rem);
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 14px;
    word-break: break-word;
}
.quiz-options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
    gap: 10px;
}
.quiz-option-btn {
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dark);
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 500;
    line-height: 1.4;
    transition: all 0.18s ease;
    min-height: 44px;
    word-break: break-word;
}
.quiz-option-btn:hover:not(:disabled) {
    border-color: var(--g-blue);
    transform: translateY(-1px);
}
.opt-letter {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(66, 133, 244, 0.18);
    color: var(--g-blue-soft);
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    font-weight: 700;
    flex-shrink: 0;
}
.opt-text {
    flex: 1;
}
.quiz-option-btn.selected {
    border-color: var(--g-blue) !important;
    background: rgba(66, 133, 244, 0.18);
}
.quiz-option-btn.selected .opt-letter {
    background: var(--g-blue);
    color: #ffffff;
}
.quiz-option-btn.correct-option {
    border-color: var(--g-green) !important;
    background: rgba(52, 168, 83, 0.18);
}
.quiz-option-btn.correct-option .opt-letter {
    background: var(--g-green);
    color: #ffffff;
}
.quiz-option-btn.wrong-option {
    border-color: var(--g-red) !important;
    background: rgba(234, 67, 53, 0.18);
}
.quiz-option-btn.wrong-option .opt-letter {
    background: var(--g-red);
    color: #ffffff;
}
.quiz-feedback-box {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1.5;
}
.quiz-feedback-box.ok {
    background: rgba(52, 168, 83, 0.14);
    border: 1px solid rgba(52, 168, 83, 0.42);
    color: #5ad47b;
}
.quiz-feedback-box.err {
    background: rgba(234, 67, 53, 0.14);
    border: 1px solid rgba(234, 67, 53, 0.42);
    color: #ff7b72;
}
.quiz-explanation-text {
    margin-top: 4px;
    font-weight: 400;
    color: var(--text-dark);
}

.quiz-submit-footer {
    margin-top: 26px;
    padding: 18px 20px;
    border-radius: 18px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}
.quiz-submit-info {
    font-size: 0.85rem;
    color: var(--text-gray);
    flex: 1;
    min-width: min(100%, 200px);
}
.submit-final-btn {
    white-space: nowrap;
}

/* Score Card */
.score-result-card {
    margin-bottom: 24px;
    padding: clamp(18px, 3vw, 26px);
    border-radius: 20px;
    border: 2px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}
.score-result-card.passed { border-color: var(--g-green); }
.score-result-card.failed { border-color: var(--g-red); }

.score-circle-box {
    width: clamp(110px, 18vw, 135px);
    height: clamp(110px, 18vw, 135px);
    border-radius: 50%;
    border: 3px solid var(--glass-border);
    background: var(--glass-solid);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-shrink: 0;
}
.score-result-card.passed .score-circle-box {
    border-color: var(--g-green);
    box-shadow: 0 8px 24px rgba(52, 168, 83, 0.22);
}
.score-result-card.failed .score-circle-box {
    border-color: var(--g-red);
    box-shadow: 0 8px 24px rgba(234, 67, 53, 0.22);
}
.score-big-number {
    font-family: var(--font-display);
    font-size: clamp(2rem, 4vw, 2.4rem);
    font-weight: 700;
    line-height: 1;
}
.score-out-of {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-gray);
    margin-top: 4px;
    letter-spacing: 0.8px;
}
.score-details-box {
    flex: 1;
    min-width: min(100%, 250px);
}
.score-status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 0.72rem;
    font-weight: 700;
    margin-bottom: 8px;
}
.score-result-card.passed .score-status-badge {
    color: #5ad47b;
    background: rgba(52, 168, 83, 0.16);
}
.score-result-card.failed .score-status-badge {
    color: #ff7b72;
    background: rgba(234, 67, 53, 0.16);
}
.score-details-box h3 {
    font-family: var(--font-display);
    font-size: clamp(1.2rem, 2.4vw, 1.45rem);
    margin-bottom: 6px;
}
.score-details-box p {
    font-size: 0.9rem;
    color: var(--text-gray);
    line-height: 1.6;
}
.score-action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

/* Code & Pre Blocks */
.content-body code {
    font-family: var(--font-mono);
    background: rgba(66, 133, 244, 0.16);
    padding: 2px 6px;
    border-radius: 5px;
    color: var(--g-blue-soft);
    font-size: 0.84rem;
}
.content-body pre, .article-block pre {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    border-radius: 14px;
    background: #10131a;
    border: 1px solid var(--glass-border);
    margin: 18px 0;
    box-shadow: var(--glass-shadow);
    max-width: 100%;
}
.content-body pre code, .article-block pre code {
    background: transparent;
    padding: 0;
    color: #e8eaed;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    line-height: 1.65;
}

.article-block {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px dashed var(--border-strong);
}
.article-block h3 {
    font-family: var(--font-display);
    color: var(--g-blue-soft);
    font-size: 1.2rem;
    margin-bottom: 10px;
}

.article-block p {
    font-size: clamp(0.9rem, 1.2vw, 0.96rem);
    line-height: 1.78;
    margin-bottom: 14px;
    white-space: pre-line;
    word-break: break-word;
    overflow-wrap: break-word;
}

/* Nav & Action Buttons */
.lesson-navigation {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
}
.nav-button {
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-dark);
    padding: 11px 16px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
}
.nav-button:hover:not(:disabled) {
    transform: translateY(-1px);
    border-color: var(--g-blue);
    color: var(--g-blue-soft);
}
.nav-button.primary {
    background: var(--g-blue);
    color: #ffffff;
    border-color: var(--g-blue);
}
.nav-button.primary:hover:not(:disabled) {
    background: #3367d6;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(66, 133, 244, 0.35);
}
.nav-button:disabled {
    opacity: 0.32;
    cursor: not-allowed;
}

/* Empty States & Toast */
.empty, .empty-screen {
    color: var(--text-gray);
    text-align: center;
    padding: 30px 16px;
    font-size: 0.88rem;
}
.empty-screen {
    max-width: 580px;
    margin: 30px auto;
    min-height: 300px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}
.empty-screen h2 {
    font-family: var(--font-display);
    font-size: 1.45rem;
    color: var(--text-dark);
    margin-bottom: 6px;
}
.empty-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(66, 133, 244, 0.16);
    color: var(--g-blue-soft);
    display: grid;
    place-items: center;
    font-size: 22px;
    margin-bottom: 14px;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 30px);
    opacity: 0;
    padding: 10px 18px;
    border-radius: 50px;
    background: var(--g-blue);
    color: #ffffff;
    font-size: 0.82rem;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(66, 133, 244, 0.35);
    transition: 0.28s ease;
    z-index: 600;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--g-red); color: #fff; }

/* =========================================================
   06. ADAPTIVE RESPONSIVE BREAKPOINTS
========================================================= */
.mobile-toggle-btn { display: none; }
.mobile-overlay {
    display: none;
    position: fixed;
    inset: 0;
    top: 60px;
    background: rgba(10, 12, 18, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 95;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
}
.mobile-overlay.show { opacity: 1; pointer-events: auto; }

@media (max-width: 1080px) {
    .main {
        grid-template-columns: 220px 1fr 250px;
    }
    .header {
        padding: 0 16px;
    }
}

@media (max-width: 900px) {
    .header {
        height: 60px;
        min-height: 60px;
        padding: 0 12px;
    }

    .brand-sub, .live-pill {
        display: none !important;
    }
    .brand-name {
        font-size: clamp(0.95rem, 3.8vw, 1.1rem);
        max-width: 170px;
    }
    .header-actions {
        gap: 6px;
    }
    .header-button {
        padding: 6px 10px;
        font-size: 0.74rem;
    }
    .mobile-toggle-btn {
        display: inline-flex;
        background: var(--g-blue);
        color: #ffffff;
        border-color: var(--g-blue);
        flex-shrink: 0;
    }
    .mobile-overlay { display: block; }

    .main {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }

    .sidebar {
        order: 1;
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
        flex-shrink: 0;
    }
    .sidebar-inner {
        padding: 8px 10px;
        height: auto;
        overflow: visible;
    }
    .sidebar-title { display: none; }
    #courseList {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        gap: 6px;
        padding-bottom: 2px;
    }
    #courseList::-webkit-scrollbar { display: none; }

    .course-item {
        width: auto;
        min-height: 36px;
        flex-shrink: 0;
        padding: 5px 12px;
        white-space: nowrap;
        border-radius: 50px;
        border: 1px solid var(--glass-border);
        margin-bottom: 0;
        font-size: 0.78rem;
    }
    .course-item:hover, .course-item.active {
        transform: none;
    }
    .course-icon {
        width: 22px;
        height: 22px;
        font-size: 10px;
    }

    .sidebar.right {
        position: fixed;
        top: 60px;
        right: 0;
        width: min(310px, 86vw);
        height: calc(100dvh - 60px);
        background: var(--glass-solid);
        z-index: 100;
        transform: translateX(105%);
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        border-left: 1px solid var(--glass-border);
        box-shadow: -10px 0 32px rgba(0, 0, 0, 0.5);
    }
    .sidebar.right.open {
        transform: translateX(0);
    }
    .sidebar.right .sidebar-inner {
        padding: 16px 12px 36px;
        height: 100%;
        overflow-y: auto;
    }

    .content {
        order: 2;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }
    .content-scroll {
        height: 100%;
        overflow-y: auto;
        padding: 14px 10px 84px;
    }
    .back-to-top {
        right: 14px;
        bottom: 16px;
        width: 42px;
        height: 42px;
    }
    .back-to-top .material-icons-outlined {
        font-size: 19px;
    }
}

@media (max-width: 480px) {
    .header {
        padding: 0 10px;
        gap: 6px;
    }
    .brand-name {
        max-width: 130px;
    }
    .header-actions {
        gap: 5px;
    }
    .header-button {
        padding: 6px 8px;
        font-size: 0.72rem;
    }
    .exp-search,
    .exp-search-trigger {
        width: 34px;
        height: 34px;
    }
    .lesson-page {
        padding: 16px 12px;
        border-radius: 16px;
    }
    .assessment-banner-card {
        padding: 14px;
    }
    .assessment-title {

<!-- Smooth Overlay Wipe Reveal when arriving from index.html -->
<script>
  (function () {
    try {
      if (!sessionStorage.getItem("yk_wipe_in")) return;
      sessionStorage.removeItem("yk_wipe_in");
    } catch (_) { return; }
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const p = document.createElement("div");
    p.style.cssText = "position:fixed;inset:0;z-index:9999;background:#121622;transform:translate3d(0,0,0);transition:transform 1.15s cubic-bezier(0.22,1,0.36,1);pointer-events:none;";
    document.body.appendChild(p);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      p.style.transform = "translate3d(100%,0,0)";
    }));
    setTimeout(() => p.remove(), 1250);
  })();
</script>

<!-- Ambient Glass Background Blobs (Matching index.html) -->
<div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="blob blob-4"></div>
</div>

        <div class="header-actions">

            <div class="exp-search" id="expSearch">
                <button
                    type="button"

                    aria-label="Open search"

                    <span class="material-icons-outlined" aria-hidden="true">search</span>

                    <button

                        <span class="material-icons-outlined" aria-hidden="true">close</span>

                </div>

            </div>

            <button class="header-button mobile-toggle-btn" onclick="window.toggleMobileMenu()">📑 Chapters</button>

    </header>
